<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>DP Construction | Luxury Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <style>
        :root {
            --main: #0f172a;
            --main-soft: #1e293b;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
        }

        /* Top App Bar (iOS Style) */
        .app-header {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .app-header-title {
            display: flex;
            flex-direction: column;
        }

        .app-header-title span.brand {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .app-header-title h1 {
            margin: 2px 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            margin-bottom: 16px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px 4px 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        /* Logo Upload Area */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 18px;
        }

        .logo-wrapper:active {
            transform: scale(0.98);
            background: #f1f5f9;
        }

        .logo-preview-box {
            width: 68px;
            height: 68px;
            border-radius: 12px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            padding: 4px;
        }

        .logo-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .logo-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .logo-info strong {
            font-size: 14px;
            color: var(--main);
        }

        .logo-info span {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* Form Elements (16px font prevents iOS Safari zoom) */
        .field-group {
            margin-bottom: 14px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.6px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--border);
            border-radius: 13px;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            background: #f8fafc;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus,
        textarea:focus {
            background: #ffffff;
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12);
        }

        textarea {
            line-height: 1.45;
            resize: vertical;
        }

        /* Line Item Card */
        .line-item {
            position: relative;
            padding: 18px;
            border-left: 5px solid var(--main);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-badge {
            font-size: 11px;
            font-weight: 800;
            color: var(--main);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-subtotal {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
        }

        .remove-btn {
            background: #fef2f2;
            color: var(--danger);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .remove-btn:active {
            transform: scale(0.9);
            background: #fee2e2;
        }

        .number-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 12px;
            margin-top: 12px;
        }

        /* Buttons */
        .btn-add {
            width: 100%;
            background: var(--main);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
            transition: transform 0.15s, background 0.2s;
        }

        .btn-add:active {
            transform: scale(0.98);
            background: var(--main-soft);
        }

        /* Terms Section */
        .term-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .term-checkbox {
            width: 22px;
            height: 22px;
            margin-top: 8px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .term-text {
            flex: 1;
            padding: 10px 12px;
            font-size: 15px;
            background: #ffffff;
            border-radius: 10px;
        }

        .term-delete {
            background: #fff;
            border: 1px solid #fee2e2;
            color: var(--danger);
            width: 32px;
            height: 32px;
            margin-top: 4px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        .term-add {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            border: 1.5px dashed #cbd5e1;
            border-radius: 13px;
            background: #f8fafc;
            color: var(--main);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .term-add:active {
            background: #e2e8f0;
        }

        /* Fixed Bottom Navigation (iPhone Optimized) */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.06);
            z-index: 1000;
        }

        .footer-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .total-box {
            display: flex;
            flex-direction: column;
        }

        .total-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .total-amount {
            font-size: 24px;
            font-weight: 900;
            color: var(--main);
            line-height: 1.1;
            margin-top: 2px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(22, 163, 74, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: transform 0.15s;
        }

        .btn-pdf:active {
            transform: scale(0.96);
        }

        @media (max-width: 380px) {
            .total-amount {
                font-size: 20px;
            }
            .btn-pdf {
                padding: 13px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="app-header-title">
            <span class="brand">DP Construction</span>
            <h1>Έκδοση Προσφοράς</h1>
        </div>
        <div class="header-badge">PDF Builder</div>
    </header>

    <div class="container">
        <!-- Γενικά Στοιχεία -->
        <div class="card">
            <div class="logo-wrapper" onclick="document.getElementById('logoInput').click()">
                <div class="logo-preview-box">
                    <img id="logoPreview" src="" alt="Logo Preview">
                </div>
                <div class="logo-info">
                    <strong>Εταιρικό Λογότυπο</strong>
                    <span>Το λογότυπο έχει φορτωθεί αυτόματα. Πατήστε εδώ αν θέλετε να το αντικαταστήσετε.</span>
                </div>
            </div>
            <input type="file" id="logoInput" style="display: none;" accept="image/*" onchange="handleLogoUpload(event)">

            <div class="field-group">
                <label for="offerTitle">Τίτλος Έργου / Προσφοράς</label>
                <input type="text" id="offerTitle" placeholder="π.χ. ΑΝΑΠΛΑΣΗ ΑΘΛΗΤΙΚΟΥ ΚΕΝΤΡΟΥ">
            </div>

            <div class="field-group">
                <label for="clientName">Στοιχεία Πελάτη</label>
                <input type="text" id="clientName" placeholder="π.χ. ΔΗΜΟΣ ΠΑΤΡΕΩΝ - ΤΕΧΝΙΚΗ ΥΠΗΡΕΣΙΑ">
            </div>

            <div class="field-group">
                <label for="offerDate">Ημερομηνία Προσφοράς</label>
                <input type="date" id="offerDate">
            </div>
        </div>

        <!-- Ενότητες Εργασιών -->
        <div class="section-header">
            <h2 class="section-title">Αναλυτικές Εργασίες</h2>
            <span id="itemsCount" style="font-size: 12px; font-weight: 700; color: var(--accent);">0 ενότητες</span>
        </div>

        <div id="items-container"></div>

        <button type="button" class="btn-add" onclick="addLine()">
            <span style="font-size: 20px; line-height: 1;">+</span> ΠΡΟΣΘΗΚΗ ΝΕΑΣ ΕΝΟΤΗΤΑΣ
        </button>

        <!-- Γενικοί Όροι -->
        <div class="section-header">
            <h2 class="section-title">Γενικοί Όροι &amp; Παρατηρήσεις</h2>
        </div>

        <div class="card">
            <div id="terms-container"></div>
            <button type="button" class="term-add" onclick="addTerm()">+ ΠΡΟΣΘΗΚΗ ΝΕΟΥ ΟΡΟΥ</button>
        </div>
    </div>

    <!-- Sticky Bottom Action Bar -->
    <div class="footer-nav">
        <div class="footer-inner">
            <div class="total-box">
                <span class="total-label">ΚΑΘΑΡΗ ΑΞΙΑ (ΠΡΟ ΦΠΑ)</span>
                <div class="total-amount"><span id="uiTotal">0,00</span>€</div>
            </div>
            <button type="button" class="btn-pdf" onclick="generatePDF()">
                <span>ΕΚΔΟΣΗ PDF</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Ελαφρύ Base64 του νέου, καθαρού λογοτύπου
        let logoBase64 = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAHgAoABAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPyA="; // Το base64 της image_1.png

        window.onload = function() {
            // Ορισμός σημερινής ημερομηνίας
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('offerDate').value = today;
            
            // Φόρτωση λογοτύπου
            document.getElementById('logoPreview').src = logoBase64;

            // Αρχικές τιμές
            addLine();
            addTerm("Η προσφορά ισχύει για 30 ημέρες από την ημερομηνία έκδοσης.");
            addTerm("Στις τιμές δεν συμπεριλαμβάνεται ο Φ.Π.Α.");
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    logoBase64 = e.target.result;
                    document.getElementById('logoPreview').src = logoBase64;
                }
                reader.readAsDataURL(file);
            }
        }

        let lineCounter = 0;
        function addLine() {
            lineCounter++;
            const container = document.getElementById('items-container');
            const item = document.createElement('div');
            item.className = 'card line-item';
            item.id = `item-${lineCounter}`;
            item.innerHTML = `
                <div class="item-top-bar">
                    <span class="item-badge">Εργασία #${lineCounter}</span>
                    <div class="item-actions">
                        <span class="item-subtotal" id="subtotal-${lineCounter}">0,00 €</span>
                        <button type="button" class="remove-btn" onclick="removeLine(${lineCounter})">✕</button>
                    </div>
                </div>
                <div class="field-group">
                    <label>Περιγραφή Εργασίας</label>
                    <textarea id="desc-${lineCounter}" rows="2" placeholder="π.χ. Χωματουργικές εργασίες και εκσκαφές..."></textarea>
                </div>
                <div class="number-grid">
                    <div class="field-group">
                        <label>Ποσότητα</label>
                        <input type="number" id="qty-${lineCounter}" value="1" min="0" step="any" oninput="calculateTotals()">
                    </div>
                    <div class="field-group">
                        <label>Τιμή Μονάδος (€)</label>
                        <input type="number" id="price-${lineCounter}" value="0" min="0" step="any" oninput="calculateTotals()">
                    </div>
                </div>
            `;
            container.appendChild(item);
            calculateTotals();
        }

        function removeLine(id) {
            const el = document.getElementById(`item-${id}`);
            if (el) {
                el.remove();
                calculateTotals();
            }
        }

        let termCounter = 0;
        function addTerm(text = "") {
            termCounter++;
            const container = document.getElementById('terms-container');
            const row = document.createElement('div');
            row.className = 'term-row';
            row.id = `term-${termCounter}`;
            row.innerHTML = `
                <input type="checkbox" class="term-checkbox" checked id="term-check-${termCounter}" onchange="calculateTotals()">
                <textarea class="term-text" id="term-text-${termCounter}" rows="1" placeholder="Γράψτε έναν όρο...">${text}</textarea>
                <button type="button" class="term-delete" onclick="removeTerm(${termCounter})">✕</button>
            `;
            container.appendChild(row);
        }

        function removeTerm(id) {
            const el = document.getElementById(`term-${id}`);
            if (el) el.remove();
        }

        function calculateTotals() {
            let total = 0;
            const itemCards = document.querySelectorAll('.line-item');
            document.getElementById('itemsCount').innerText = `${itemCards.length} ενότητες`;

            itemCards.forEach(card => {
                const id = card.id.split('-')[1];
                const qty = parseFloat(document.getElementById(`qty-${id}`).value) || 0;
                const price = parseFloat(document.getElementById(`price-${id}`).value) || 0;
                const sub = qty * price;
                total += sub;
                document.getElementById(`subtotal-${id}`).innerText = sub.toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
            });

            document.getElementById('uiTotal').innerText = total.toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function generatePDF() {
            const title = document.getElementById('offerTitle').value || "ΠΡΟΣΦΟΡΑ ΕΡΓΑΣΙΩΝ";
            const client = document.getElementById('clientName').value || "-";
            const dateInput = document.getElementById('offerDate').value;
            const dateStr = dateInput ? new Date(dateInput).toLocaleDateString('el-GR') : "-";

            const tableBody = [
                [
                    { text: 'Α/Α', style: 'tableHeader', alignment: 'center' },
                    { text: 'ΠΕΡΙΓΡΑΦΗ ΕΡΓΑΣΙΩΝ / ΥΛΙΚΩΝ', style: 'tableHeader' },
                    { text: 'ΠΟΣΟΤΗΤΑ', style: 'tableHeader', alignment: 'center' },
                    { text: 'ΤΙΜΗ ΜΟΝ.', style: 'tableHeader', alignment: 'right' },
                    { text: 'ΣΥΝΟΛΟ', style: 'tableHeader', alignment: 'right' }
                ]
            ];

            let count = 0;
            let total = 0;
            document.querySelectorAll('.line-item').forEach(card => {
                count++;
                const id = card.id.split('-')[1];
                const desc = document.getElementById(`desc-${id}`).value || "-";
                const qty = parseFloat(document.getElementById(`qty-${id}`).value) || 0;
                const price = parseFloat(document.getElementById(`price-${id}`).value) || 0;
                const sub = qty * price;
                total += sub;

                tableBody.push([
                    { text: count.toString(), alignment: 'center', margin: [0, 6, 0, 6] },
                    { text: desc, margin: [0, 6, 0, 6] },
                    { text: qty.toString(), alignment: 'center', margin: [0, 6, 0, 6] },
                    { text: price.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', alignment: 'right', margin: [0, 6, 0, 6] },
                    { text: sub.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', alignment: 'right', style: 'subtotal', margin: [0, 6, 0, 6] }
                ]);
            });

            const terms = [];
            document.querySelectorAll('.term-row').forEach(row => {
                const id = row.id.split('-')[1];
                const checked = document.getElementById(`term-check-${id}`).checked;
                const text = document.getElementById(`term-text-${id}`).value;
                if (checked && text.trim() !== "") {
                    terms.push({ text: `•  ${text}`, margin: [0, 2, 0, 2], fontSize: 9.5 });
                }
            });

            const docDefinition = {
                content: [
                    {
                        columns: [
                            {
                                image: logoBase64,
                                width: 140,
                                margin: [0, 0, 0, 15]
                            },
                            {
                                text: [
                                    { text: 'DP CONSTRUCTION\n', style: 'companyName' },
                                    { text: 'Τεχνική Εταιρεία\n', style: 'companySub' },
                                    { text: 'Email: info@dpconstruction.gr\nΤηλ: 2610 123456', style: 'companyDetails' }
                                ],
                                alignment: 'right'
                            }
                        ]
                    },
                    { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, strokeColor: '#cbd5e1' }], margin: [0, 15, 0, 25] },
                    { text: 'ΟΙΚΟΝΟΜΙΚΗ ΠΡΟΣΦΟΡΑ', style: 'mainTitle' },
                    { text: title, style: 'projectTitle' },
                    {
                        columns: [
                            {
                                text: [
                                    { text: 'ΠΡΟΣ:\n', style: 'infoLabel' },
                                    { text: client, style: 'infoValue' }
                                ]
                            },
                            {
                                text: [
                                    { text: 'ΗΜΕΡΟΜΗΝΙΑ:\n', style: 'infoLabel' },
                                    { text: dateStr, style: 'infoValue' }
                                ],
                                alignment: 'right'
                            }
                        ],
                        margin: [0, 0, 0, 30]
                    },
                    {
                        table: {
                            headersRows: 1,
                            widths: [30, '*', 65, 75, 85],
                            body: tableBody
                        },
                        layout: {
                            hLineWidth: function (i, node) { return (i === 0 || i === node.table.body.length) ? 0 : 0.5; },
                            vLineWidth: function () { return 0; },
                            hLineColor: function () { return '#e2e8f0'; },
                            paddingLeft: function () { return 8; },
                            paddingRight: function () { return 8; }
                        }
                    },
                    {
                        columns: [
                            { text: '', width: '*' },
                            {
                                table: {
                                    widths: [120, 90],
                                    body: [
                                        [
                                            { text: 'ΚΑΘΑΡΗ ΑΞΙΑ:', style: 'totalLabel' },
                                            { text: total.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', style: 'totalVal', alignment: 'right' }
                                        ]
                                    ]
                                },
                                layout: 'noBorders',
                                margin: [0, 20, 0, 0]
                            }
                        ]
                    }
                ],
                styles: {
                    companyName: { fontSize: 16, bold: true, color: '#0f172a' },
                    companySub: { fontSize: 9, color: '#64748b', bold: true },
                    companyDetails: { fontSize: 8.5, color: '#64748b' },
                    mainTitle: { fontSize: 11, bold: true, color: '#f97316', tracking: 1.5, margin: [0, 0, 0, 4] },
                    projectTitle: { fontSize: 18, bold: true, color: '#0f172a', margin: [0, 0, 0, 20] },
                    infoLabel: { fontSize: 8, color: '#64748b', bold: true },
                    infoValue: { fontSize: 11, color: '#0f172a', bold: true },
                    tableHeader: { fontSize: 9.5, bold: true, color: '#0f172a', fillOpacity: 0.5 },
                    subtotal: { bold: true, color: '#0f172a' },
                    totalLabel: { fontSize: 10, bold: true, color: '#64748b' },
                    totalVal: { fontSize: 14, bold: true, color: '#f97316' },
                    termsHeader: { fontSize: 10, bold: true, color: '#0f172a' }
                },
                defaultStyle: {
                    fontSize: 10,
                    color: '#334155'
                }
            };

            // Προσθήκη όρων εάν υπάρχουν
            if (terms.length > 0) {
                docDefinition.content.push(
                    { text: 'ΓΕΝΙΚΟΙ ΟΡΟΙ & ΣΗΜΕΙΩΣΕΙΣ', style: 'termsHeader', margin: [0, 40, 0, 8] },
                    { text: '', margin: [0, 0, 0, 4] },
                    ...terms
                );
            }

            pdfMake.createPdf(docDefinition).download(`Προσφορά_${title.replace(/ /g, '_')}.pdf`);
        }
    </script>
</body>

</html>
