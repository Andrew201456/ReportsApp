<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17243a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>DP Construction | Προσφορές</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <style>
        :root {
            --main: #17243a;
            --main-2: #243752;
            --accent: #d49a45;
            --accent-soft: #fbf4e9;
            --ink: #182235;
            --muted: #718096;
            --line: #e6eaf0;
            --surface: #ffffff;
            --canvas: #f3f5f8;
            --danger: #c24141;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            margin: 0;
            padding: 18px 14px calc(150px + var(--safe-bottom));
            background:
                radial-gradient(ellipse at top left, rgba(212,154,69,.10), transparent 38%),
                var(--canvas);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .container { width: 100%; max-width: 720px; margin: 0 auto; }
        .header-ui { text-align: center; margin-bottom: 18px; }
        .header-ui h2 {
            margin: 6px 0 4px;
            color: var(--main);
            font-size: 25px;
            line-height: 1.15;
            font-weight: 850;
            letter-spacing: 3px;
        }
        .header-ui h2::after {
            content: "";
            display: block;
            width: 42px;
            height: 3px;
            margin: 13px auto 0;
            border-radius: 9px;
            background: var(--accent);
        }

        .card {
            background: var(--surface);
            padding: 22px;
            margin: 0 0 16px;
            border: 1px solid rgba(226,232,240,.9);
            border-radius: 22px;
            box-shadow: 0 8px 28px rgba(23,36,58,.055);
        }
        .card h3 {
            color: var(--main) !important;
            font-size: 15px !important;
            letter-spacing: .35px;
            line-height: 1.4;
        }

        .logo-box {
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 18px;
            border: 1.5px dashed #d6dce5;
            border-radius: 18px;
            background: linear-gradient(145deg, #fbfcfe, #f5f7fa);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: border-color .2s, background .2s;
        }
        .logo-box:active { border-color: var(--accent); background: var(--accent-soft); }
        .logo-box img {
            display: block;
            width: auto;
            max-width: min(100%, 210px) !important;
            max-height: 78px;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: none !important;
        }
        .logo-box span {
            color: var(--muted) !important;
            font-size: 11px !important;
            font-weight: 750;
            letter-spacing: .7px;
        }

        label {
            display: block;
            margin: 19px 0 8px;
            color: #536176;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.05px;
            text-transform: uppercase;
        }
        input, textarea {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 15px 14px;
            border: 1.5px solid var(--line);
            border-radius: 13px;
            background: #fbfcfe;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            line-height: 1.4;
            outline: none;
            box-shadow: none;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        input:focus, textarea:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(212,154,69,.13);
        }
        input::placeholder, textarea::placeholder { color: #a2acba; }
        input[type="date"] { min-height: 51px; }
        input[type="number"] { font-variant-numeric: tabular-nums; }
        textarea { resize: vertical; min-height: 105px; }
        input[type="file"] { display: none; }

        .line-item {
            position: relative;
            padding: 20px;
            border-left: 4px solid var(--accent);
            animation: slideIn .25s ease-out;
        }
        .line-item label:first-of-type { padding-right: 76px; margin-top: 3px; }
        .line-item textarea { min-height: 116px; line-height: 1.55 !important; }
        .line-item > div[style*="display:flex"] {
            display: grid !important;
            grid-template-columns: 1fr 1fr;
            gap: 12px !important;
        }
        .line-item > div[style*="display:flex"] > div { min-width: 0; }
        .line-item > div[style*="display:flex"] label { margin-top: 14px; }
        .remove-btn {
            position: absolute;
            top: 17px;
            right: 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid #f2dada;
            border-radius: 10px;
            background: #fff8f8;
            color: var(--danger);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .4px;
            cursor: pointer;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            min-height: 52px;
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-add {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #2d405d;
            border-radius: 15px;
            background: var(--main);
            color: #fff;
            font-size: 13px;
            font-weight: 850;
            letter-spacing: .5px;
            box-shadow: 0 7px 18px rgba(23,36,58,.15);
            cursor: pointer;
        }
        .btn-add:active, .btn-pdf:active { transform: scale(.985); }

        .term-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 0 0 10px;
            padding: 12px;
            border: 1px solid #edf0f4;
            border-radius: 14px;
            background: #fbfcfe;
        }
        .term-checkbox {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            margin: 3px 0 0;
            padding: 0;
            border-radius: 6px;
            accent-color: var(--accent);
        }
        .term-text {
            flex: 1;
            min-height: 72px;
            padding: 10px 11px;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer-nav {
            position: fixed;
            z-index: 1000;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 13px max(18px, calc((100vw - 720px) / 2)) calc(13px + var(--safe-bottom));
            border-top: 1px solid rgba(226,232,240,.9);
            background: rgba(255,255,255,.94);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            backdrop-filter: saturate(180%) blur(18px);
            box-shadow: 0 -8px 28px rgba(23,36,58,.07);
        }
        .footer-nav > div { min-width: 0; }
        .footer-nav label {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: .7px;
            white-space: nowrap;
        }
        .total-amount {
            color: var(--main);
            font-size: clamp(20px, 5vw, 27px);
            font-weight: 900;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .btn-pdf {
            flex: 0 0 auto;
            max-width: 58%;
            padding: 13px 17px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #1b8b5a, #137447);
            color: #fff;
            font-size: 12px;
            font-weight: 850;
            line-height: 1.25;
            box-shadow: 0 6px 16px rgba(19,116,71,.22);
            cursor: pointer;
        }

        @media (min-width: 700px) {
            body { padding-top: 30px; }
            .card { padding: 26px; }
            .footer-nav { padding-left: max(28px, calc((100vw - 720px) / 2)); padding-right: max(28px, calc((100vw - 720px) / 2)); }
            .btn-pdf { max-width: none; padding: 15px 25px; font-size: 13px; }
        }
        @media (max-width: 420px) {
            body { padding: 12px 10px calc(145px + var(--safe-bottom)); }
            .header-ui h2 { font-size: 23px; }
            .card { padding: 17px; border-radius: 19px; }
            .line-item { padding: 16px; }
            .line-item > div[style*="display:flex"] { gap: 9px !important; }
            .footer-nav { gap: 10px; padding-right: 12px; padding-left: 12px; }
            .footer-nav label { font-size: 8px; }
            .total-amount { font-size: 21px; }
            .btn-pdf { max-width: 55%; min-height: 50px; padding: 10px 11px; font-size: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>

    <meta property="og:image" content="https://tiiny.host/assets/logo-purple-bg.png" data-id="th-modified">
    <meta property="og:url" content="https://salmon-jackelyn-28.tiiny.site/" data-id="th-modified">
    <meta property="og:type" content="website" data-id="th-modified">
    <script type="text/javascript" src="https://tiiny.host/ad-script.js"></script>
    <script defer="" data-domain="salmon-jackelyn-28.tiiny.site"
        src="https://analytics.tiiny.site/js/plausible.js"></script>
</head>

<body>

    <div class="container">
        <div class="header-ui">
            <h2 style="color: var(--main); letter-spacing: 2px;">ΠΡΟΣΦΟΡΑ</h2>
        </div>

        <div class="card">
            <div class="header-ui">
                <div class="logo-box" onclick="document.getElementById('logoInput').click()">
                    <img id="logoPreview" src="https://via.placeholder.com/120x60?text=LOGO" alt="Logo Preview"
                        style="max-width: 100%; height: auto; display: block; margin: 0 auto;">
                    <span style="font-size: 10px; color: #64748b; margin-top: 5px; display: block;">ΚΛΙΚ ΓΙΑ ΑΛΛΑΓΗ
                        ΛΟΓΟΤΥΠΟΥ</span>
                </div>
                <input type="file" id="logoInput" style="display: none;" accept="image/*"
                    onchange="handleLogoUpload(event)">
            </div>
            <label>Τίτλος Έργου / Προσφοράς</label>
            <input type="text" id="offerTitle" placeholder="π.χ. ΑΝΑΠΛΑΣΗ ΑΘΛΗΤΙΚΟΥ ΚΕΝΤΡΟΥ">
            <label>Στοιχεία Πελάτη</label>
            <input type="text" id="clientName" placeholder="π.χ. ΔΗΜΟΣ ΠΑΤΡΕΩΝ - ΤΕΧΝΙΚΗ ΥΠΗΡΕΣΙΑ">
            <label>Ημερομηνία Προσφοράς</label>
            <input type="date" id="offerDate">
        </div>

        <div id="items-container"></div>
        <button class="btn-add" onclick="addLine()">+ ΠΡΟΣΘΗΚΗ ΝΕΑΣ ΕΝΟΤΗΤΑΣ</button>

        <div class="card" style="margin-top: 20px;">
            <h3 style="color: var(--main); margin-top: 0; font-size: 14px; text-transform: uppercase;">Γενικοί Όροι
                &amp; Παρατηρήσεις</h3>
            <div id="terms-container"></div>
        </div>
    </div>

    <div class="footer-nav">
        <div>
            <label style="margin:0">ΣΥΝΟΛΟ ΚΑΘΑΡΗΣ ΑΞΙΑΣ</label>
            <div class="total-amount"><span id="uiTotal">0.00</span>€</div>
        </div>
        <button class="btn-pdf" onclick="generatePDF()">ΕΚΔΟΣΗ ΦΑΚΕΛΟΥ ΠΡΟΣΦΟΡΑΣ</button>
    </div>

    <script>
        // Το λογότυπο αποθηκεύεται τοπικά στον browser μετά την πρώτη μεταφόρτωση.
        let logoBase64 = '';
        let logoBottomLeftBase64 = '';

        function loadSavedLogo() {
            try {
                logoBase64 = localStorage.getItem('dpConstructionLogo') || '';
                logoBottomLeftBase64 = logoBase64;
                if (logoBase64) {
                    document.getElementById('logoPreview').src = logoBase64;
                }
            } catch (error) {
                console.warn('Δεν ήταν δυνατή η ανάκτηση του αποθηκευμένου logo:', error);
            }
        }

        function handleLogoUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Παρακαλώ επίλεξε ένα αρχείο εικόνας.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const base64String = e.target.result;
                logoBase64 = base64String;
                logoBottomLeftBase64 = base64String;
                document.getElementById('logoPreview').src = base64String;

                try {
                    localStorage.setItem('dpConstructionLogo', base64String);
                } catch (error) {
                    alert('Το logo φορτώθηκε, αλλά δεν ήταν δυνατή η μόνιμη αποθήκευσή του στον browser. Δοκίμασε μικρότερη εικόνα.');
                }
            };
            reader.readAsDataURL(file);
        }

        function addLine(text = '') {
            const id = Date.now() + Math.floor(Math.random() * 1000);
            const container = document.getElementById('items-container');
            const div = document.createElement('div');
            div.className = 'card line-item';
            div.id = `line-${id}`;
            div.innerHTML = `
            <span class="remove-btn" onclick="removeLine(${id})">ΔΙΑΓΡΑΦΗ</span>
            <label>ΑΝΑΛΥΤΙΚΗ ΠΕΡΙΓΡΑΦΗ ΕΡΓΑΣΙΑΣ</label>
            <textarea id="desc-${id}" oninput="updateTotal()" rows="4" style="line-height:1.5">${text}</textarea>
            <div style="display:flex; gap:15px; margin-top:10px;">
                <div style="flex:1"><label>ΠΟΣΟΤΗΤΑ</label><input type="number" id="qty-${id}" value="1" oninput="updateTotal()"></div>
                <div style="flex:1"><label>ΤΙΜΗ ΜΟΝΑΔΟΣ (€)</label><input type="number" id="price-${id}" value="0" oninput="updateTotal()"></div>
            </div>
        `;
            container.appendChild(div);
            updateTotal();
        }

        function removeLine(id) { document.getElementById(`line-${id}`).remove(); updateTotal(); }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('[id^="desc-"]').forEach(el => {
                const id = el.id.split('-')[1];
                total += (parseFloat(document.getElementById(`qty-${id}`).value) || 0) * (parseFloat(document.getElementById(`price-${id}`).value) || 0);
            });
            document.getElementById('uiTotal').innerText = total.toLocaleString('el-GR', { minimumFractionDigits: 2 });
        }

        function generatePDF() {
            const title = document.getElementById('offerTitle').value.toUpperCase() || "ΠΡΟΣΦΟΡΑ ΕΡΓΩΝ";
            const client = document.getElementById('clientName').value.toUpperCase() || "---";
            const rawDate = document.getElementById('offerDate').value;
            const offerDate = rawDate ? new Date(rawDate).toLocaleDateString('el-GR') : new Date().toLocaleDateString('el-GR');

            // Robust image helper
            const getLogo = (b64, width, align = 'center', margin = [0, 0, 0, 0]) => {
                // Case-insensitive check for 'base64' (common issue)
                if (b64 && b64.length > 500 && b64.toLowerCase().includes('base64,')) {
                    return { image: b64, width: width, alignment: align, margin: margin };
                }
                return { text: '', margin: margin };
            };

            let tableRows = [
                [
                    { text: 'ΠΕΡΙΓΡΑΦΗ ΤΕΧΝΙΚΩΝ ΕΡΓΑΣΙΩΝ', style: 'tableHeader' },
                    { text: 'ΠΟΣ.', style: 'tableHeader' },
                    { text: 'ΤΙΜΗ ΜΟΝ.', style: 'tableHeader' },
                    { text: 'ΣΥΝΟΛΟ', style: 'tableHeader' }
                ]
            ];

            let grandTotal = 0;
            document.querySelectorAll('[id^="desc-"]').forEach((el, index) => {
                const id = el.id.split('-')[1];
                const q = parseFloat(document.getElementById(`qty-${id}`).value) || 0;
                const p = parseFloat(document.getElementById(`price-${id}`).value) || 0;
                const sub = q * p;
                grandTotal += sub;

                tableRows.push([
                    { text: el.value, margin: [0, 8, 0, 8], fontSize: 10, lineHeight: 1.4, verticalAlign: 'middle', alignment: 'left' },
                    { text: q.toString(), alignment: 'center', margin: [0, 8, 0, 8], verticalAlign: 'middle' },
                    { text: p.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', alignment: 'center', margin: [0, 8, 0, 8], verticalAlign: 'middle' },
                    { text: sub.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', alignment: 'center', bold: true, color: '#1e293b', margin: [0, 8, 0, 8], verticalAlign: 'middle' }
                ]);
            });

            // Dynamic Terms Collection
            let selectedTerms = [];
            document.querySelectorAll('.term-row').forEach(row => {
                const cb = row.querySelector('.term-checkbox');
                const txt = row.querySelector('.term-text').value;
                if (cb.checked && txt.trim()) {
                    selectedTerms.push({ text: txt.trim(), margin: [0, 5] });
                }
            });

            const docDef = {
                pageSize: 'A4',
                pageMargins: [40, 50, 40, 50],
                background: function (currentPage) {
                    if (currentPage > 1) {
                        return { canvas: [{ type: 'rect', x: 0, y: 0, w: 10, h: 842, color: '#1e293b' }] };
                    }
                },
                content: [
                    // --- PAGE 1: LUXURY COVER ---
                    getLogo(logoBase64, 150, 'center', [0, 120, 0, 30]),
                    { canvas: [{ type: 'line', x1: 100, y1: 0, x2: 415, y2: 0, lineWidth: 1, lineColor: '#f97316' }], margin: [0, 0, 0, 40] },
                    { text: 'ΤΕΧΝΙΚΗ & ΟΙΚΟΝΟΜΙΚΗ', fontSize: 14, alignment: 'center', color: '#64748b', characterSpacing: 5 },
                    { text: title, fontSize: 38, bold: true, alignment: 'center', margin: [0, 10, 0, 10], color: '#1e293b' },
                    { text: 'ΠΡΟΣΦΟΡΑ ΕΡΓΑΣΙΩΝ', fontSize: 14, alignment: 'center', color: '#64748b', characterSpacing: 5, margin: [0, 0, 0, 40] },
                    {
                        table: {
                            widths: ['*'],
                            body: [[{
                                text: 'ΠΡΟΣ: ' + client,
                                alignment: 'center',
                                fontSize: 16,
                                bold: true,
                                color: '#1e293b',
                                fillColor: '#f8fafc',
                                padding: [15, 15],
                                border: [false, false, false, false]
                            }]]
                        },
                        margin: [40, 0, 40, 0]
                    },
                    { text: 'ΗΜΕΡΟΜΗΝΙΑ: ' + offerDate, fontSize: 10, alignment: 'center', color: '#94a3b8', margin: [0, 100, 0, 0] },

                    // --- PAGE 2: MAIN TABLE ---
                    { text: '', pageBreak: 'before' },
                    {
                        columns: [
                            {
                                stack: [getLogo(logoBase64, 60, 'left')]
                            },
                            {
                                stack: [
                                    { text: 'DP CONSTRUCTION', bold: true, color: '#1e293b', fontSize: 16 },
                                    { text: 'ΚΑΤΑΣΚΕΥΑΣΤΙΚΗ ΕΤΑΙΡΕΙΑ', fontSize: 9, color: '#f97316', bold: true },
                                    { text: 'ΠΕΡΙΑΝΔΡΟΥ 20 • ΒΡΑΧΑΤΙ • ΑΦΜ: 802849066', fontSize: 8, color: '#64748b', margin: [0, 5, 0, 0] },
                                    { text: 'Email: psychosdimitrios@gmail.com • Τηλ: 6975554238', fontSize: 8, color: '#64748b' }
                                ], alignment: 'right'
                            }
                        ], margin: [0, 0, 0, 40]
                    },
                    { text: 'ΑΝΑΛΥΤΙΚΟΣ ΠΙΝΑΚΑΣ ΕΡΓΑΣΙΩΝ', fontSize: 14, bold: true, color: '#1e293b', margin: [0, 0, 0, 20] },
                    {
                        table: {
                            headerRows: 1,
                            widths: ['*', 40, 80, 90],
                            body: tableRows
                        },
                        layout: {
                            hLineWidth: (i, node) => (i === 0 || i === node.table.body.length) ? 0 : 0.5,
                            vLineWidth: () => 0,
                            hLineColor: (i, node) => '#cbd5e1',
                            paddingTop: (i) => (i === 0) ? 14 : 10,
                            paddingBottom: (i) => (i === 0) ? 14 : 10,
                            fillColor: (rowIndex) => (rowIndex === 0) ? '#1e293b' : (rowIndex % 2 === 0 ? '#f8fafc' : null)
                        }
                    },
                    {
                        margin: [0, 20, 0, 0],
                        columns: [
                            { text: '' },
                            {
                                stack: [
                                    { text: 'ΣΥΝΟΛΙΚΟ ΚΟΣΤΟΣ ΕΠΕΝΔΥΣΗΣ (ΠΡΟ ΦΠΑ 24%)', fontSize: 9, color: '#64748b', bold: true, margin: [0, 0, 0, 5] },
                                    { text: grandTotal.toLocaleString('el-GR', { minimumFractionDigits: 2 }) + ' €', fontSize: 24, bold: true, color: '#f97316' }
                                ], alignment: 'right'
                            }
                        ]
                    },

                    // --- PAGE 3: TERMS & BANK ---
                    { text: '', pageBreak: 'before' },
                    { text: 'ΓΕΝΙΚΟΙ ΟΡΟΙ & ΠΡΟΫΠΟΘΕΣΕΙΣ', fontSize: 14, bold: true, color: '#1e293b', margin: [0, 0, 0, 20] },
                    {
                        ul: selectedTerms.length > 0 ? selectedTerms : [{ text: '---', margin: [0, 5] }],
                        color: '#334155', fontSize: 11, lineHeight: 1.5
                    },
                    {
                        margin: [0, 50, 0, 0],
                        stack: [
                            { text: 'ΣΤΟΙΧΕΙΑ ΤΡΑΠΕΖΙΚΟΥ ΛΟΓΑΡΙΑΣΜΟΥ (ΠΕΙΡΑΙΩΣ)', bold: true, color: '#f97316', fontSize: 10, margin: [0, 0, 0, 10] },
                            { text: 'IBAN: GR92 0171 3350 0063 3516 9473 041', fontSize: 18, bold: true, color: '#1e293b', characterSpacing: 1 },
                            { text: 'ΔΙΚΑΙΟΥΧΟΣ: ΨΥΧΟΣ ΔΗΜΗΤΡΙΟΣ', fontSize: 12, color: '#1e293b', bold: true, margin: [0, 5, 0, 0] }
                        ]
                    },
                    {
                        margin: [0, 50, 0, 0],
                        columns: [
                            {
                                stack: [getLogo(logoBottomLeftBase64 || logoBase64, 100, 'left')]
                            },
                            {
                                stack: [
                                    { text: 'Με εκτίμηση,\n\n', alignment: 'right', bold: true, fontSize: 12, color: '#1e293b' },
                                    { text: '__________________________\nDP CONSTRUCTION', alignment: 'right', bold: true, fontSize: 12, color: '#1e293b' }
                                ]
                            }
                        ]
                    }
                ],
                styles: {
                    tableHeader: { bold: true, fontSize: 11, color: 'white', fillColor: '#1e293b', margin: [0, 5, 0, 5], alignment: 'center' }
                }
            };

            try {
                const pdf = pdfMake.createPdf(docDef);
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                if (isIOS) {
                    // Στο iOS Safari το άνοιγμα του PDF είναι πιο αξιόπιστο από το forced download.
                    pdf.open();
                } else {
                    pdf.download("ΠΡΟΣΦΟΡΑ_" + title + ".pdf");
                }
            } catch (e) {
                console.error("PDF generation failed:", e);
                alert("Υπήρξε σφάλμα στην παραγωγή του PDF. Θα γίνει προσπάθεια λήψης χωρίς εικόνες.");
                try {
                    const fallback = JSON.parse(JSON.stringify(docDef));
                    const stripImages = (obj) => {
                        for (let k in obj) {
                            if (k === 'image') delete obj[k];
                            else if (typeof obj[k] === 'object' && obj[k] !== null) stripImages(obj[k]);
                        }
                    };
                    stripImages(fallback);
                    pdfMake.createPdf(fallback).download("ΠΡΟΣΦΟΡΑ_" + title + " (NO_IMAGES).pdf");
                } catch (fallbackError) {
                    alert("Κρίσιμο σφάλμα: Δεν είναι δυνατή η παραγωγή του PDF.");
                }
            }
        }

        function addTerm(text = "", isChecked = true) {
            const container = document.getElementById('terms-container');
            const row = document.createElement('div');
            row.className = 'term-row';
            row.innerHTML = `
            <input type="checkbox" class="term-checkbox" ${isChecked ? 'checked' : ''}>
            <textarea class="term-text" rows="2">${text}</textarea>
        `;
            container.appendChild(row);
        }

        window.onload = function () {

            loadSavedLogo();
            const defaults = [
                "Σετ γηπέδου PADEL αποτελούμενο από μεταλλικά πλαίσια διατομής RHS 100X50X2 ,RHS 40X40X2 γαλβανιζέ. Η κατασκευή θα είναι βαμμένη με ηλεκτροστατική βαφή σε RAL της επιλογής σας .Χρήση 4 μεταλλικών στηλών 6m ,διατομής RHS 100X50X2 .Περιλαμβάνει 8 προβολείς των 200 watt και τάπητα PRO PADEL TURF",
                "Αναλώσιμα για την τοποθέτηση του τάπητα (κόλλα , ταινίες, χαλαζιακή άμμος)",
                "Τοποθέτηση αθλητικού τάπητα",
                "Τοποθέτηση μεταλλικής κατασκευής , υαλοπινάκων και φωτιστικών σωμάτων"
            ];
            defaults.forEach(text => addLine(text));

            const defaultTerms = [
                "Η επιλογή χρώματος των μεταλλικών κατασκευών είναι δωρεάν σε οποιαδήποτε απόχρωση επιθυμείτε.",
                "Στις αναγραφόμενες τιμές δεν συμπεριλαμβάνεται ο νόμιμος Φ.Π.Α. 24%.",
                "Η παρούσα προσφορά δεν καλύπτει τα έξοδα μεταφοράς των υλικών, καθώς και τα έξοδα διαμονής και διατροφής του συνεργείου.",
                "Κατά τη διάρκεια των εργασιών πρέπει στον χώρο να υπάρχει ανυψωτικό μηχάνημα (κλαρκ ή γερανός) για τη φόρτωση, εκφόρτωση και τοποθέτηση των υλικών. Η χρήση ανυψωτικών μηχανημάτων δεν περιλαμβάνεται στην παρούσα προσφορά.",
                "Τρόπος πληρωμής: 50% προκαταβολή με την ανάθεση του έργου, 30% με τη φόρτωση των υλικών και 20% εξόφληση με την περαίωση των εργασιών.",
                "Ο συνθετικός τάπητας συνοδεύεται από πιστοποιητικό καταλληλότητας ΕΝ-71-3 για πολυκυκλικούς υδρογονάνθρακες."
            ];
            defaultTerms.forEach(text => addTerm(text));

            // Set default date to today
            const now = new Date();
            const today = [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, '0'),
                String(now.getDate()).padStart(2, '0')
            ].join('-');
            document.getElementById('offerDate').value = today;
        };
    </script>
